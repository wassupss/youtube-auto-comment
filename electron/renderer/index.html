<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src http://127.0.0.1:17117; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>유튜브 자동 채팅 봇</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 헤더 -->
      <header>
        <div class="header-icon">▶</div>
        <div>
          <h1>유튜브 자동 채팅 봇</h1>
          <p class="subtitle">YouTube Live 채팅 자동 전송 도구</p>
        </div>
        <div id="status-badge" class="badge badge-idle">대기 중</div>
      </header>

      <!-- 탭 -->
      <nav class="tabs">
        <button class="tab active" data-tab="settings">⚙️ 설정</button>
        <button class="tab" data-tab="messages">📝 문구 편집</button>
        <button class="tab" data-tab="log">📋 실행 로그</button>
      </nav>

      <!-- 설정 탭 -->
      <section id="tab-settings" class="tab-content active">
        <div class="form-group">
          <label>YouTube URL</label>
          <input
            type="text"
            id="youtube-url"
            placeholder="https://www.youtube.com/watch?v=..."
          />
        </div>
        <div class="form-group">
          <label>브라우저 선택</label>
          <div class="browser-select-row">
            <button class="btn-browser active" data-browser="chrome">
              🌐 Chrome
            </button>
            <button class="btn-browser" data-browser="brave">🦁 Brave</button>
            <button class="btn-browser" data-browser="custom">
              📁 직접 지정
            </button>
          </div>
          <div
            id="custom-path-row"
            class="input-row"
            style="display: none; margin-top: 8px"
          >
            <input
              type="text"
              id="browser-path"
              placeholder="브라우저 실행파일 경로"
            />
            <button class="btn-secondary" id="browse-browser">찾아보기</button>
          </div>
          <p class="hint" id="browser-hint" style="margin-top: 6px">
            Chrome 기본 설치 경로를 자동으로 사용합니다.
          </p>
        </div>
        <div class="form-group">
          <label>전송 간격 (초)</label>
          <div class="interval-row">
            <div class="interval-field">
              <span class="interval-label">최소</span>
              <input type="number" id="interval-min" min="5" max="3600" value="45" />
              <span class="interval-unit">초</span>
            </div>
            <span class="interval-tilde">~</span>
            <div class="interval-field">
              <span class="interval-label">최대</span>
              <input type="number" id="interval-max" min="5" max="3600" value="65" />
              <span class="interval-unit">초</span>
            </div>
          </div>
          <p class="hint" style="margin-top: 6px">
            입력한 범위 내에서 랜덤한 초마다 채팅을 전송합니다.
          </p>
        </div>
        <div class="form-actions">
          <button class="btn-secondary" id="save-config">💾 설정 저장</button>
        </div>
        <p
          id="config-error"
          style="color: #f87171; font-size: 12px; min-height: 16px"
        ></p>
      </section>

      <!-- 문구 편집 탭 -->
      <section id="tab-messages" class="tab-content">
        <div class="hint-box">
          <p class="hint-title">📌 작성 방법</p>
          <p class="hint">• 한 줄에 문구 하나씩 입력하세요.</p>
          <p class="hint">• 빈 줄은 자동으로 무시됩니다.</p>
        </div>
        <textarea
          id="messages-editor"
          placeholder="여기에 문구를 입력하세요...&#10;&#10;예)&#10;지금 라이브 보고 있어요!&#10;항상 좋은 방송 감사합니다 🙏"
        ></textarea>
        <div class="form-actions">
          <button class="btn-secondary" id="reload-messages">
            🔄 다시 불러오기
          </button>
          <button class="btn-secondary" id="save-messages">
            💾 파일에 저장
          </button>
        </div>
      </section>

      <!-- 로그 탭 -->
      <section id="tab-log" class="tab-content">
        <div id="log-box"></div>
        <div class="form-actions">
          <button class="btn-secondary" id="clear-log">🗑 로그 지우기</button>
          <button class="btn-download" id="btn-download" style="display: none">
            📥 리포트 다운로드
          </button>
        </div>
      </section>

      <!-- 하단 실행 버튼 -->
      <footer>
        <button class="btn-start" id="btn-start">▶ 봇 시작</button>
        <button
          class="btn-login-ready"
          id="btn-login-ready"
          style="display: none"
        >
          🔐 로그인 완료
        </button>
        <button class="btn-stop" id="btn-stop" disabled>■ 중지</button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
